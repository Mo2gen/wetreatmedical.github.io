<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
        }

        header {
            background-color: #4db7ff;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .checkout-box {
            background: white;
            width: 800px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h2 {
            margin-top: 30px;
            color: #333;
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .product-summary {
            background: #eaf6ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .product-title {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .price {
            color: #4db7ff;
            font-weight: bold;
            margin-top: 5px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #444;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row > div {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .payment-options {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .payment-options label {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .buy-btn {
            margin-top: 25px;
            padding: 15px;
            background-color: #4db7ff;
            color: white;
            text-align: center;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        .buy-btn:hover {
            background-color: #2aa4f0;
        }
    </style>
</head>

<body>

<header>
    Checkout
</header>

<div class="container">

    <div class="checkout-box">

        <div class="product-summary">
            <div class="product-title" id="productName">Produkt</div>
            <div class="price" id="productPrice">€ 0,00</div>
        </div>

        <form>

            <h2>Unternehmensdaten</h2>

            <label for="company">Firmenname</label>
            <input id="company" type="text">

            <div class="row">
                <div>
                    <label for="uid">UID Nummer</label>
                    <input id="uid" type="text">
                </div>

                <div>
                    <label for="fbn">Firmenbuchnummer</label>
                    <input id="fbn" type="text">
                </div>
            </div>

            <h2>Ansprechperson</h2>

            <div class="row">
                <div>
                    <label for="contact-name">Name</label>
                    <input id="contact-name" type="text">
                </div>

                <div>
                    <label for="contact-email">E-Mail</label>
                    <input id="contact-email" type="email">
                </div>
            </div>

            <h2>Rechnungsadresse</h2>

            <label for="street">Straße & Hausnummer</label>
            <input id="street" type="text">

            <div class="row">
                <div>
                    <label for="zip">PLZ</label>
                    <input id="zip" type="text">
                </div>

                <div>
                    <label for="city">Stadt</label>
                    <input id="city" type="text">
                </div>
            </div>

            <label for="country">Land</label>
            <input id="country" type="text">

            <h2>Zahlungsart</h2>

            <div class="payment-options">
                <label for="invoice">
                    <input id="invoice" type="radio" name="pay">
                    Rechnung
                </label>

                <label for="card">
                    <input id="card" type="radio" name="pay">
                    Kreditkarte
                </label>
            </div>

            <h2>Kartendaten</h2>

            <label for="card-number">Kartennummer</label>
            <input id="card-number" type="text">

            <div class="row">
                <div>
                    <label for="exp">Ablaufdatum</label>
                    <input id="exp" type="text">
                </div>

                <div>
                    <label for="cvc">CVC</label>
                    <input id="cvc" type="text">
                </div>
            </div>

            <div class="checkbox">
                <input id="terms" type="checkbox">
                <label for="terms">Ich akzeptiere die Lizenzbedingungen</label>
            </div>

            <button class="buy-btn" type="submit">
                Jetzt kostenpflichtig bestellen
            </button>

        </form>

    </div>

</div>

</body>
</html>
